name: Verificar panel
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check
      - run: npm test
      - run: npm install --no-save --package-lock=false --ignore-scripts playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
