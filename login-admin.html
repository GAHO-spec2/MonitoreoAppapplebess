<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Admin Login | Applebee's Loyalty Control Center</title>

  <link rel="icon" type="image/png" sizes="32x32" href="manzanas.png">
  <link rel="stylesheet" href="css/admin.css" />
  <link rel="stylesheet" href="css/cards.css" />
<link rel="stylesheet" href="css/tablas.css" />
<link rel="stylesheet" href="css/dashboard.css" />
<link rel="stylesheet" href="css/modals.css" />
<link rel="stylesheet" href="css/responsive.css" />
</head>

<body>
  <main class="login-page">
    <section class="login-card">
      <div class="brand login-brand">
        <div class="brand-logo">A</div>
        <div>
          <h1>Applebee's Loyalty</h1>
          <p>Control Center</p>
        </div>
      </div>

      <div class="login-heading">
        <h2>Acceso administrativo</h2>
        <p>Ingresa con una cuenta autorizada.</p>
      </div>

      <div class="login-form">
        <label>Correo electrónico</label>
        <input type="email" id="emailAdmin" placeholder="usuario@gahospitality.com" autocomplete="email">

        <label>Contraseña</label>
        <input type="password" id="passwordAdmin" placeholder="••••••••" autocomplete="current-password">

        <button class="btn btn-primary" onclick="loginAdmin()">
          Ingresar al panel
        </button>
      </div>

      <div class="login-footer">
        <span id="firebaseStatus">Conectando con Firebase...</span>
        <small>Powered by GA Hospitality</small>
      </div>
    </section>
  </main>

  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-storage-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>

  <script src="js/firebase.js"></script>
  <script src="js/common.js?v=admin_1"></script>
  <script src="js/auth.js?v=admin_1"></script>

  <script>
    const firebaseStatus = document.getElementById("firebaseStatus");

    if (firebaseStatus) {
      firebaseStatus.textContent = "Firebase conectado";
    }

    auth.onAuthStateChanged(async (user) => {
      if (!user) return;

      try {
        const snap = await rtdb.ref("users/" + user.uid).once("value");
        const data = snap.val() || {};
        const role = String(data.role || "").toLowerCase().trim();

        if (ROLES_PERMITIDOS.includes(role)) {
          window.location.href = "dashboard.html";
        }
      } catch (error) {
        console.error(error);
      }
    });

    async function loginAdmin() {
      const email = document.getElementById("emailAdmin").value.trim();
      const password = document.getElementById("passwordAdmin").value.trim();

      if (!email || !password) {
        showToast("Ingresa correo y contraseña.", "error");
        return;
      }

      try {
        showLoader("Validando acceso...");

        const cred = await auth.signInWithEmailAndPassword(email, password);
        const snap = await rtdb.ref("users/" + cred.user.uid).once("value");
        const data = snap.val() || {};
        const role = String(data.role || "").toLowerCase().trim();

        if (!ROLES_PERMITIDOS.includes(role)) {
          await auth.signOut();
          hideLoader();
          showToast("No tienes permisos para acceder.", "error");
          return;
        }

        hideLoader();
        window.location.href = "dashboard.html";

      } catch (error) {
        console.error(error);
        hideLoader();
        showToast("Error al iniciar sesión: " + error.message, "error");
      }
    }

    document.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        loginAdmin();
      }
    });
  </script>
</body>
</html>
