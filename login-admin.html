<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Admin Login | Applebee's Loyalty Control Center</title>

  <link rel="icon" type="image/svg+xml" href="img/favicon.svg">
  <link rel="stylesheet" href="css/admin.css" />
  <link rel="stylesheet" href="css/cards.css" />
<link rel="stylesheet" href="css/tablas.css" />
<link rel="stylesheet" href="css/dashboard.css" />
<link rel="stylesheet" href="css/modals.css" />
<link rel="stylesheet" href="css/responsive.css" />
</head>

<body>
  <main class="login-page">
    <section class="login-card">
      <div class="brand login-brand">
        <div class="brand-logo">A</div>
        <div>
          <h1>Applebee's Loyalty</h1>
          <p>Control Center</p>
        </div>
      </div>

      <div class="login-heading">
        <h2>Acceso administrativo</h2>
        <p>Ingresa con una cuenta autorizada.</p>
      </div>

      <div class="login-form">
        <label>Correo electrónico</label>
        <input type="email" id="emailAdmin" placeholder="usuario@gahospitality.com" autocomplete="email">

        <label>Contraseña</label>
        <input type="password" id="passwordAdmin" placeholder="••••••••" autocomplete="current-password">

        <button id="ingresarAdmin" class="btn btn-primary" onclick="loginAdmin()">
          Ingresar al panel
        </button>
      </div>

      <div class="login-footer">
        <span id="firebaseStatus">Conectando con Firebase...</span>
        <small>Powered by GA Hospitality</small>
      </div>
    </section>
  </main>

  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-storage-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>

  <script src="js/firebase.js?v=monitor_4"></script>
  <script src="js/common.js?v=monitor_4"></script>
  <script src="js/monitoreo.js?v=monitor_4"></script>
<script src="js/auth.js?v=monitor_5"></script>

  <script src="js/login.js?v=monitor_4"></script>
</body>
</html>
